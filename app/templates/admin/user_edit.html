{% extends "base_form.html" %}

{% block title %}ویرایش کاربر{% endblock %}
{% block form_title %}ویرایش کاربر{% endblock %}
{% block cancel_url %}/auth/users{% endblock %}

{% block form_body %}
<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label required">نام کامل</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label class="form-label">تلفن</label>
        <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
    </div>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">نقش</label>
        <select name="role_id" class="form-select">
            <option value="">بدون نقش</option>
            {% for role in roles %}
            <option value="{{ role.id }}" {% if user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" role="switch" name="is_active" value="true" id="isActive" {% if user.is_active %}checked{% endif %}>
    <label class="form-check-label" for="isActive">کاربر فعال باشد</label>
</div>
{% endblock %}
