<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - Bonyan Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --ink: #1f2933;
            --muted: #66737f;
            --line: #d9e0e5;
            --surface: #ffffff;
            --canvas: #eef2f4;
            --accent: #176b5b;
            --accent-hover: #125548;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--canvas);
            color: var(--ink);
            font-family: Tahoma, Arial, sans-serif;
        }
        .login-shell {
            width: min(100%, 420px);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(31, 41, 51, 0.12);
            padding: 32px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            background: var(--ink);
            color: #fff;
            font-size: 1.25rem;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }
        .form-label {
            font-size: 0.86rem;
            font-weight: 600;
        }
        .form-control {
            min-height: 44px;
            border-color: var(--line);
            border-radius: 6px;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.14);
        }
        .btn-primary {
            min-height: 44px;
            border-radius: 6px;
            background: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand">
            <div class="brand-mark"><i class="bi bi-building"></i></div>
            <div>
                <h1>Bonyan Core</h1>
                <p>سامانه مدیریت تعاونی مسکن</p>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/login-page">
            <input type="hidden" name="next_url" value="{{ next_url }}">
            <div class="mb-3">
                <label class="form-label" for="username">نام کاربری</label>
                <input id="username" type="text" name="username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">رمز عبور</label>
                <input id="password" type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-left ms-1"></i>
                ورود
            </button>
        </form>
    </main>
</body>
</html>
