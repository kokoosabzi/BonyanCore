version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bonyan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bonyan_core
      POSTGRES_USER: bonyan
      POSTGRES_PASSWORD: bonyan123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: bonyan-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  api:
    build: .
    container_name: bonyan-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: